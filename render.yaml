# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repository.
# Render's free plan blocks SMTP, so real emails go out through Brevo's HTTPS API (BREVO_API_KEY).
services:
  - type: web
    name: saathi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "true"
      # The only secret needed to start. Paste it when Render asks.
      - key: GEMINI_API_KEY
        sync: false
      # For real emails later, add BREVO_API_KEY, MAIL_FROM (and optionally DEMO_EMAIL)
      # in the service's Environment tab. Until then, emails go to the in-app outbox.
